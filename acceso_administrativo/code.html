<!DOCTYPE html>

<html class="light" lang="es"><head>

    background-size: cover;
    background-position: center
    }</style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#45464d",
                        "on-secondary-container": "#54647a",
                        "outline-variant": "#c6c6cd",
                        "surface-container-low": "#f2f4f6",
                        "secondary-container": "#d0e1fb",
                        "surface-variant": "#e0e3e5",
                        "primary": "#000000",
                        "on-primary-fixed": "#131b2e",
                        "on-tertiary-fixed": "#271901",
                        "on-surface": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "surface-tint": "#565e74",
                        "surface-bright": "#f7f9fb",
                        "background": "#f7f9fb",
                        "secondary-fixed-dim": "#b7c8e1",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container": "#eceef0",
                        "secondary-fixed": "#d3e4fe",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "outline": "#76777d",
                        "tertiary": "#000000",
                        "tertiary-fixed": "#fcdeb5",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-tertiary-container": "#98805d",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-primary-container": "#7c839b",
                        "surface-dim": "#d8dadc",
                        "surface": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "inverse-primary": "#bec6e0",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e6e8ea",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#191c1e",
                        "primary-container": "#131b2e",
                        "tertiary-container": "#271901",
                        "secondary": "#505f76",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#38485d",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary-fixed-variant": "#574425"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "md": "24px",
                        "margin-desktop": "64px",
                        "base": "8px",
                        "lg": "48px",
                        "xl": "80px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "display-lg": ["Montserrat"],

                        "title-md": ["Montserrat"],

                    "fontSize": {

                        "headline-lg-mobile": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<body class="bg-surface-bright text-on-surface font-body-md text-body-md overflow-hidden">
<main class="min-h-screen w-full flex items-center justify-center bg-blur-hero p-margin-mobile" data-alt="A wide-angle interior photograph of a minimalist luxury penthouse featuring expansive floor-to-ceiling windows overlooking a twilight city skyline. The interior is styled with soft, neutral tones and high-end marble surfaces, creating an atmosphere of exclusivity and professional calm. The lighting is low-key and sophisticated, with subtle warm glows from architectural recessed lights, perfectly complementing a clean and professional corporate real estate aesthetic.">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-sm p-xl md:p-xl flex flex-col gap-lg border border-outline-variant/20 relative z-10">
<!-- Logo Section -->
<div class="flex flex-col items-center gap-xs">
<span class="font-headline-lg text-headline-lg tracking-tight text-primary">LUXE ESTATE</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Panel de Administración</span>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="username">Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="admin_panel_settings">admin_panel_settings</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all outline-none text-on-surface" id="username" placeholder="admin" type="text" value="admin"/>
</div>
</div>
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center px-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">¿Olvidaste la clave?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all outline-none text-on-surface" id="password" placeholder="admin123" type="password" value="admin123"/>
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer select-none" for="remember">Recordar mi sesión</label>
</div>
<button class="mt-base w-full py-4 bg-primary text-on-primary rounded-lg font-title-md text-title-md hover:bg-on-primary-fixed-variant transition-all active:scale-[0.98] shadow-sm" type="submit">
                    Acceder al Panel
                </button>
</form>
<!-- Footer of the Card -->
<div class="pt-md border-t border-outline-variant/30 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    Soporte técnico: <a class="text-primary font-bold hover:underline" href="mailto:support@luxeestate.pro">support@luxeestate.pro</a>
</p>
</div>
</div>
<!-- Decorative Subtle Elements -->
<div class="absolute bottom-base right-margin-desktop hidden md:block">
<p class="font-label-sm text-label-sm text-on-surface-variant/60">© 2024 Luxe Estate Professional. Gestión de Activos de Lujo.</p>
</div>
</main>
</body></html>
